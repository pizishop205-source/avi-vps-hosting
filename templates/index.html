<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AVI VPS HOSTING</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#070b16;
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-y:auto;
    padding:20px;
}

/* BACKGROUND GLOW */

body::before{

    content:'';
    position:absolute;

    width:500px;
    height:500px;

    background:radial-gradient(circle,#2458ff33,transparent 70%);

    top:-200px;
    left:-150px;
}

body::after{

    content:'';
    position:absolute;

    width:500px;
    height:500px;

    background:radial-gradient(circle,#2458ff22,transparent 70%);

    bottom:-200px;
    right:-150px;
}

/* LOGIN BOX */

.login-box{

    width:100%;
    max-width:460px;

    background:#0c1120;

    border:1px solid rgba(255,255,255,0.05);

    border-radius:30px;

    overflow:hidden;

    position:relative;

    z-index:10;

    box-shadow:
    0 20px 50px rgba(0,0,0,0.6);
}

/* HEADER */

.login-header{

    padding:45px 35px;

    text-align:center;

    background:linear-gradient(
        to bottom,
        #10182d,
        #0c1120
    );

    border-bottom:1px solid rgba(255,255,255,0.05);
}

/* ICON */

.logo-icon{

    width:90px;
    height:90px;

    border-radius:28px;

    background:linear-gradient(
        145deg,
        #4f86ff,
        #2358ff
    );

    display:flex;
    align-items:center;
    justify-content:center;

    margin:auto;

    font-size:38px;

    color:white;

    margin-bottom:25px;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.45);
}

/* TITLE */

.login-header h1{

    font-size:2.1rem;

    font-weight:800;

    color:white;

    margin-bottom:8px;
}

.login-header h1 span{

    color:#2f6cff;
}

.login-header p{

    color:#8f99c7;

    font-size:0.95rem;
}

/* BODY */

.login-body{

    padding:35px;
}

/* INPUT */

.input-group{

    margin-bottom:22px;
}

.input-group label{

    display:block;

    color:#aab4dd;

    margin-bottom:10px;

    font-weight:600;
}

.input-group input{

    width:100%;

    height:58px;

    background:#050814;

    border:1px solid #1f2847;

    border-radius:16px;

    padding:0 18px;

    color:white;

    outline:none;

    font-size:0.95rem;

    transition:0.2s;
}

.input-group input:focus{

    border-color:#2f6cff;

    box-shadow:
    0 0 0 4px rgba(47,108,255,0.15);
}

.input-group input::placeholder{

    color:#6874a6;
}

/* LOGIN BUTTON */

.login-btn{

    width:100%;

    height:58px;

    border:none;

    border-radius:16px;

    background:linear-gradient(
        145deg,
        #2f6cff,
        #4a8dff
    );

    color:white;

    font-size:1rem;

    font-weight:700;

    cursor:pointer;

    transition:0.2s;

    margin-top:5px;

    box-shadow:
    0 10px 25px rgba(47,108,255,0.3);
}

.login-btn:hover{

    transform:translateY(-2px);
}

/* FOOTER */

.footer{

    padding:30px 35px;

    border-top:1px solid rgba(255,255,255,0.05);

    background:#0b1020;
}

/* TELEGRAM */

.telegram{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    margin-bottom:20px;

    color:#8ea2ff;

    font-weight:600;
}

.telegram-icon{

    width:42px;
    height:42px;

    border-radius:50%;

    background:#229ED9;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;

    color:white;
}

/* BUTTONS */

.footer-buttons{

    display:flex;

    flex-direction:column;

    gap:14px;
}

.footer-buttons a{

    text-decoration:none;

    width:100%;

    height:54px;

    border-radius:16px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:700;

    transition:0.2s;
}

/* FREE SERVER BUTTON */

.free-btn{

    background:linear-gradient(
        145deg,
        #2f6cff,
        #4a8dff
    );

    color:white;
}

/* CONTACT BUTTON */

.contact-btn{

    background:#111728;

    border:1px solid #1e2747;

    color:#c5d1ff;
}

.footer-buttons a:hover{

    transform:translateY(-2px);
}

/* MOBILE */

@media(max-width:500px){

    .login-header{

        padding:35px 25px;
    }

    .login-body{

        padding:25px;
    }

    .footer{

        padding:25px;
    }

    .logo-icon{

        width:75px;
        height:75px;

        font-size:30px;
    }

    .login-header h1{

        font-size:1.7rem;
    }
}

</style>

</head>

<body>

<div class="login-box">

    <!-- HEADER -->

    <div class="login-header">

        <div class="logo-icon">
            ☁
        </div>

        <h1>
            AVI <span>VPS HOSTING</span>
        </h1>

        <p>
            Premium Telegram & Discord Bot Hosting
        </p>

    </div>

    <!-- LOGIN BODY -->

    <div class="login-body">

        <form method="POST" action="/login">

            <div class="input-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    required
                >

            </div>

            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
            >

                Login Dashboard

            </button>

        </form>

    </div>

    <!-- FOOTER -->

    <div class="footer">

        <div class="telegram">

            <div class="telegram-icon">
                ✈
            </div>

            Telegram Community

        </div>

        <div class="footer-buttons">

            <a
                href="#"
                class="free-btn"
            >

                Get Free Server

            </a>

            <a
                href="#"
                class="contact-btn"
            >

                Contact Admin

            </a>

        </div>

    </div>

</div>

</body>
</html>
