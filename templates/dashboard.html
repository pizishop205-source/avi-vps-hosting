<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AVI VPS HOSTING</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#070b16;

    font-family:'Inter',sans-serif;

    color:white;

    overflow-y:auto;
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#2f6cff;
    border-radius:20px;
}

::-webkit-scrollbar-track{
    background:#0b1020;
}

/* LAYOUT */

.wrapper{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{

    width:280px;

    background:#0b1020;

    border-right:1px solid rgba(255,255,255,0.05);

    padding:25px;

    position:fixed;

    height:100vh;

    overflow-y:auto;
}

/* LOGO */

.logo{

    display:flex;

    align-items:center;

    gap:15px;

    margin-bottom:40px;
}

.logo-box{

    width:70px;
    height:70px;

    border-radius:22px;

    background:linear-gradient(
        145deg,
        #4f86ff,
        #2358ff
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;
}

.logo h1{

    font-size:1.7rem;

    font-weight:800;
}

.logo span{

    color:#2f6cff;
}

/* MENU */

.menu{

    display:flex;

    flex-direction:column;

    gap:14px;
}

.menu button{

    border:none;

    background:#111728;

    color:#b7c3f5;

    padding:16px 18px;

    border-radius:16px;

    text-align:left;

    font-weight:600;

    cursor:pointer;

    transition:0.2s;
}

.menu button:hover,
.menu button.active{

    background:#2f6cff;

    color:white;
}

/* MAIN */

.main{

    margin-left:280px;

    width:100%;

    padding:25px;
}

/* TOPBAR */

.topbar{

    background:#0d1323;

    border:1px solid rgba(255,255,255,0.05);

    border-radius:24px;

    padding:25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;
}

.topbar h2{

    font-size:2rem;

    font-weight:800;
}

.topbar p{

    color:#98a2cb;

    margin-top:6px;
}

/* LOGOUT */

.logout{

    background:#ff3d3d;

    color:white;

    text-decoration:none;

    padding:14px 20px;

    border-radius:14px;

    font-weight:700;
}

/* PANEL */

.panel{

    background:#0d1323;

    border-radius:24px;

    padding:25px;

    border:1px solid rgba(255,255,255,0.05);
}

/* SECTION */

.section{
    display:none;
}

.section.active{
    display:block;
}

/* BUTTONS */

.buttons{

    display:flex;

    gap:15px;

    flex-wrap:wrap;

    margin-bottom:25px;
}

.btn{

    border:none;

    padding:14px 24px;

    border-radius:14px;

    color:white;

    font-weight:700;

    cursor:pointer;

    transition:0.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.start{
    background:#20bf55;
}

.stop{
    background:#ff3d3d;
}

.restart{
    background:#2f6cff;
}

.upload{
    background:#ff9f1a;
}

/* CONSOLE */

.console{

    background:black;

    border-radius:18px;

    padding:20px;

    height:450px;

    overflow-y:auto;

    font-family:monospace;

    color:#20bf55;

    line-height:1.8;

    white-space:pre-wrap;
}

/* TERMINAL INPUT */

.terminal-input{

    margin-top:18px;

    width:100%;

    height:60px;

    background:#050814;

    border:1px solid #1f2847;

    border-radius:18px;

    display:flex;

    align-items:center;

    padding:0 18px;

    gap:15px;
}

.dollar{

    color:#20bf55;

    font-size:1.2rem;

    font-weight:700;

    font-family:monospace;
}

.terminal-input input{

    width:100%;

    height:100%;

    background:none;

    border:none;

    outline:none;

    color:white;

    font-size:1rem;

    font-family:monospace;
}

.terminal-input input::placeholder{

    color:#6d78a8;
}

/* STARTUP */

.startup-box{

    display:flex;

    flex-direction:column;

    gap:20px;
}

.input-group input{

    width:100%;

    height:58px;

    background:#050814;

    border:1px solid #1f2847;

    border-radius:16px;

    padding:0 18px;

    color:white;

    outline:none;

    font-size:0.95rem;
}

/* FILES */

.files-grid{

    display:flex;

    flex-direction:column;

    gap:15px;
}

.file{

    background:#111728;

    padding:18px;

    border-radius:18px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.file-left{

    display:flex;

    align-items:center;

    gap:15px;
}

.file-icon{

    width:50px;
    height:50px;

    border-radius:14px;

    background:#1d2747;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
}

/* 3 DOT */

.menu-box{
    position:relative;
}

.dot-btn{

    width:42px;
    height:42px;

    border:none;

    border-radius:12px;

    background:#1d2747;

    color:white;

    font-size:20px;

    cursor:pointer;
}

.dropdown{

    position:absolute;

    right:0;

    top:55px;

    background:#111728;

    border:1px solid rgba(255,255,255,0.05);

    border-radius:16px;

    width:170px;

    display:none;

    overflow:hidden;

    z-index:100;
}

.dropdown button{

    width:100%;

    border:none;

    background:none;

    color:white;

    text-align:left;

    padding:14px 16px;

    cursor:pointer;
}

.dropdown button:hover{
    background:#1d2747;
}

/* MOBILE */

@media(max-width:768px){

    .wrapper{
        flex-direction:column;
    }

    .sidebar{

        position:relative;

        width:100%;

        height:auto;
    }

    .main{
        margin-left:0;
    }

    .topbar{

        flex-direction:column;

        align-items:flex-start;

        gap:15px;
    }
}

</style>

</head>

<body>

<div class="wrapper">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">

            <div class="logo-box">
                ☁
            </div>

            <h1>
                AVI <span>HOSTING</span>
            </h1>

        </div>

        <div class="menu">

            <button class="active" onclick="showSection('console',this)">
                🖥 Console
            </button>

            <button onclick="showSection('files',this)">
                📁 Files
            </button>

            <button onclick="showSection('startup',this)">
                ⚙ Startup
            </button>

        </div>

    </div>

    <!-- MAIN -->

    <div class="main">

        <!-- TOPBAR -->

        <div class="topbar">

            <div>

                <h2>
                    Welcome {{username}}
                </h2>

                <p>
                    AVI VPS HOSTING PANEL
                </p>

            </div>

            <a href="/logout" class="logout">
                Logout
            </a>

        </div>

        <!-- CONSOLE -->

        <div id="console" class="section active">

            <div class="panel">

                <div class="buttons">

                    <a href="/start">
                        <button class="btn start">
                            START
                        </button>
                    </a>

                    <a href="/stop">
                        <button class="btn stop">
                            STOP
                        </button>
                    </a>

                    <a href="/restart">
                        <button class="btn restart">
                            RESTART
                        </button>
                    </a>

                </div>

                <div
                    class="console"
                    id="console-box"
                >

[INFO] AVI VPS HOSTING READY
[INFO] Waiting for bot startup...
[SYSTEM] Console Connected
[SUCCESS] Panel Loaded Successfully

                </div>

                <!-- COMMAND INPUT -->

                <div class="terminal-input">

                    <span class="dollar">
                        $
                    </span>

                    <input
                        type="text"
                        id="commandInput"
                        placeholder="Type command
 and press Enter..."
                        autocomplete="off"
                    >

                </div>

            </div>

        </div>

        <!-- FILES -->

        <div id="files" class="section">

            <div class="panel">

                <div class="buttons">

                    <form
                        action="/upload"
                        method="POST"
                        enctype="multipart/form-data"
                    >

                        <input
                            type="file"
                            name="file"
                            required
                        >

                        <br><br>

                        <button
                            class="btn upload"
                            type="submit"
                        >

                            Upload File

                        </button>

                    </form>

                </div>

                <div class="files-grid">

                    <!-- FILE -->

                    <div class="file">

                        <div class="file-left">

                            <div class="file-icon">
                                📄
                            </div>

                            <div>

                                <h3>bot.py</h3>

                                <p>
                                    Python File
                                </p>

                            </div>

                        </div>

                        <div class="menu-box">

                            <button
                                class="dot-btn"
                                onclick="toggleMenu(this)"
                            >

                                ⋮

                            </button>

                            <div class="dropdown">

                                <button onclick="renameFile()">
                                    Rename
                                </button>

                                <button onclick="deleteFile()">
                                    Delete
                                </button>

                                <button onclick="newFile()">
                                    New File
                                </button>

                                <button onclick="newFolder()">
                                    New Folder
                                </button>

                                <button onclick="extractFile()">
                                    Extract
                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- STARTUP -->

        <div id="startup" class="section">

            <div class="panel">

                <div class="startup-box">

                    <div class="input-group">

                        <label>
                            Main Startup File
                        </label>

                        <br><br>

                        <input
                            type="text"
                            placeholder="bot.py"
                        >

                    </div>

                    <div class="input-group">

                        <label>
                            Requirements File
                        </label>

                        <br><br>

                        <input
                            type="text"
                            placeholder="requirements.txt"
                        >

                    </div>

                    <button class="btn restart">

                        Save Startup Settings

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

/* SECTION SWITCH */

function showSection(id,element){

    document.querySelectorAll(".section").forEach(sec=>{

        sec.classList.remove("active")

    })

    document.getElementById(id).classList.add("active")

    document.querySelectorAll(".menu button").forEach(btn=>{

        btn.classList.remove("active")

    })

    element.classList.add("active")
}

/* MENU */

function toggleMenu(button){

    let menu = button.nextElementSibling

    document.querySelectorAll(".dropdown").forEach(drop=>{

        if(drop !== menu){

            drop.style.display = "none"
        }

    })

    if(menu.style.display === "block"){

        menu.style.display = "none"

    }else{

        menu.style.display = "block"
    }
}

/* FILE FUNCTIONS */

function renameFile(){

    let name = prompt(
        "domain.com says\n\nEnter new file name"
    )

    if(name){

        alert("Renamed to: " + name)
    }
}

function deleteFile(){

    if(confirm(
        "domain.com says\n\nDelete this file?"
    )){

        alert("File Deleted")
    }
}

function newFile(){

    let file = prompt(
        "domain.com says\n\nEnter file name"
    )

    if(file){

        alert("Created File: " + file)
    }
}

function newFolder(){

    let folder = prompt(
        "domain.com says\n\nEnter folder name"
    )

    if(folder){

        alert("Created Folder: " + folder)
    }
}

function extractFile(){

    if(confirm(
        "domain.com says\n\nExtract this file?"
    )){

        alert("File Extracted")
    }
}

/* CLOSE MENU */

window.onclick = function(e){

    if(!e.target.matches('.dot-btn')){

        document.querySelectorAll(".dropdown").forEach(drop=>{

            drop.style.display = "none"

        })
    }
}

/* TERMINAL */

const commandInput =
document.getElementById("commandInput")

const consoleBox =
document.getElementById("console-box")

commandInput.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            let command =
            this.value.trim()

            if(command === "") return

            consoleBox.innerHTML +=
            "\n$ " + command

            if(command === "clear"){

                consoleBox.innerHTML = ""

            }

            else if(command === "help"){

                consoleBox.innerHTML +=
                "\nhelp"
                +
                "\nclear"
                +
                "\nls"
                +
                "\npwd"
                +
                "\npython bot.py"

            }

            else if(command === "ls"){

                consoleBox.innerHTML +=
                "\nbot.py"
                +
                "\nrequirements.txt"
                +
                "\nmain.py"

            }

            else if(command === "pwd"){

                consoleBox.innerHTML +=
                "\n/uploads/{{username}}"

            }

            else if(command.startsWith("python")){

                consoleBox.innerHTML +=
                "\n[INFO] Starting Bot..."
                +
                "\n[SUCCESS] Bot Running"

            }

            else{

                consoleBox.innerHTML +=
                "\n[ERROR] Unknown Command"

            }

            consoleBox.scrollTop =
            consoleBox.scrollHeight

            this.value = ""
        }
    }
)

</script>

</body>
</html>
